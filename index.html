<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d2138">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KOEN 코냥이 경주 복불복</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
  
<style>
  :root{
    --sky-top:#7ec8f7; --sky-bot:#bfe9ff;
    --ink:#16365c; --panel:#fdfdf4; --panel-edge:#16365c;
    --accent:#1273c4; --gold:#ffd23f;
  }
  *{margin:0;padding:0;box-sizing:border-box;image-rendering:pixelated;}
  html,body{height:100%;}
  body{
    background:#0d2138;
    display:flex;align-items:center;justify-content:center;
    font-family:'Galmuri11','DotGothic16','NeoDunggeunmo',monospace;
    color:var(--ink);
    -webkit-font-smoothing:none;
  }
  /* ---------- portrait stage ---------- */
  #stage{
    position:relative;width:min(100vw,960px);height:min(100vh,540px);
    height:min(100dvh,540px); /* 모바일 브라우저 UI 변동 대응 */
    background:linear-gradient(var(--sky-top) 0%,var(--sky-bot) 78%,#d8f4ff 100%);
    overflow:hidden;
    box-shadow:0 0 0 4px var(--ink);
  }
  /* pixel clouds */
  .cloud{position:absolute;animation:drift linear infinite;opacity:.9;}
  .cloud i{position:absolute;background:#fff;}
  @keyframes drift{from{transform:translateX(1000px);}to{transform:translateX(-180px);}}
  .hill{position:absolute;bottom:0;left:0;width:100%;height:46px;
    background:
      linear-gradient(#9adb6e,#7cc454);
    border-top:4px solid #5ea33b;}
  .hill::before{content:"";position:absolute;top:-12px;left:0;width:100%;height:8px;
    background:repeating-linear-gradient(90deg,#7cc454 0 12px,transparent 12px 24px);}

  /* ---------- shared UI ---------- */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;}
  .screen.on{display:flex;}
  .pxpanel{
    background:var(--panel);
    border:4px solid var(--ink);
    box-shadow:0 6px 0 var(--ink), inset 0 0 0 3px #fff, inset 0 0 0 6px #cfe3f5;
    padding:18px 20px;
  }
  .pxbtn{
    font-family:inherit;font-size:18px;color:#fff;cursor:pointer;
    background:var(--accent);border:4px solid var(--ink);
    box-shadow:0 5px 0 var(--ink);padding:10px 22px;
    text-shadow:1px 1px 0 #0a4a85;letter-spacing:1px;
    transition:transform .04s,box-shadow .04s;
  }
  .pxbtn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink);}
  .pxbtn.gold{background:var(--gold);color:var(--ink);text-shadow:1px 1px 0 #fff;}
  .pxbtn:focus-visible{outline:3px dashed #fff;outline-offset:2px;}
  h1.logo{
    font-size:26px;line-height:1.5;text-align:center;color:#fff;
    text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);
    letter-spacing:2px;
  }
  .sub{font-size:12px;color:#2c5b8f;text-align:center;letter-spacing:1px;}

  /* ---------- screen 1 : setup (landscape) ---------- */
  #setup{flex-direction:row;justify-content:center;align-items:center;gap:54px;padding:0 30px;}
  .setupCol{display:flex;flex-direction:column;align-items:center;gap:18px;}
  #setup .heroSprite{width:147px;height:auto;animation:bob 1.2s steps(2) infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) scaleX(-1);}50%{transform:translateY(-8px) scaleX(-1);}}
  .counterRow{display:flex;align-items:center;gap:18px;}
  .countBox{
    min-width:96px;text-align:center;font-size:40px;padding:8px 0;
    background:#fff;border:4px solid var(--ink);box-shadow:inset 0 -8px 0 #dcecfa;
  }
  .pxbtn.round{font-size:26px;padding:8px 18px;line-height:1;}
  .miniPreview{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:300px;min-height:34px;}
  .miniChip{
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    font-size:14px;color:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
    text-shadow:1px 1px 0 rgba(0,0,0,.45);
  }

  /* ---------- screen 2 : race ---------- */
  #race{padding:0;}
  #trackWrap{position:relative;flex:1;width:100%;padding:54px 0 60px;}
  .lane{position:absolute;left:0;width:100%;}
  .lane .ground{
    position:absolute;left:0;right:0;bottom:-4px;height:3px;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 10px,transparent 10px 20px);
  }
  .trail{
    position:absolute;height:6px;left:0;bottom:14px;
    box-shadow:0 3px 0 rgba(22,54,92,.25);
  }
  .runner{position:absolute;bottom:0;will-change:transform;}
  .runner img{
    width:var(--runner-size,64px);height:auto;display:block;transform:scaleX(-1);
    animation:gallop .5s steps(2) infinite;
  }
  .runner.stopped img{animation:shiver .15s steps(2) infinite;}
  @keyframes gallop{0%,100%{margin-top:0;}50%{margin-top:-5px;}}
  @keyframes shiver{0%,100%{transform:scaleX(-1) translateX(0);}50%{transform:scaleX(-1) translateX(2px);}}
  /* 번호표: 스프라이트 진행방향 앞쪽에 매칭되는 컬러 플레이트 */
  .bib{
    position:absolute;bottom:6px;left:62px;z-index:3;
    min-width:24px;text-align:center;
    font-size:14px;line-height:1;color:#fff;padding:5px 6px 4px;
    border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
    text-shadow:1px 1px 0 rgba(0,0,0,.45);
  }
  .bib::after{ /* 깃대 느낌의 작은 다리 */
    content:"";position:absolute;left:50%;bottom:-9px;width:4px;height:6px;
    transform:translateX(-50%);background:var(--ink);
  }
  /* 과열 폭발/연기 오버레이 */
  .fx{
    position:absolute;bottom:2px;left:-2px;width:68px;height:auto;
    z-index:4;display:none;pointer-events:none;
  }
  .fx.show{display:block;}
  .fx.smoking{animation:smokeRise .8s steps(4) infinite;}
  @keyframes smokeRise{
    0%{transform:translateY(0) scale(.9);opacity:.95;}
    100%{transform:translateY(-16px) scale(1.15);opacity:.35;}
  }
  /* goal */
  #goal{position:absolute;top:0;bottom:0;right:34px;width:10px;
    background:repeating-linear-gradient(0deg,#16365c 0 10px,#fff 10px 20px);
    border-left:3px solid var(--ink);border-right:3px solid var(--ink);}
  #goalFlag{position:absolute;top:14px;right:8px;font-size:0;}
  .flagPx{display:grid;grid-template-columns:repeat(4,8px);grid-auto-rows:8px;border:3px solid var(--ink);}
  .flagPx b{background:#16365c;}.flagPx i{background:#fff;}
  #raceTimer{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    font-size:18px;color:#fff;letter-spacing:2px;
    background:rgba(22,54,92,.85);border:3px solid var(--ink);padding:5px 16px;z-index:5;
  }
  #countdown{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:90px;color:#fff;z-index:9;pointer-events:none;
    text-shadow:4px 4px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink);
  }

  /* ---------- screen 3 : result ---------- */
  #result{justify-content:center;gap:16px;padding:16px 24px;}
  #podium{
    width:100%;max-width:760px;max-height:60vh;overflow-y:auto;
    display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;
  }
  #podium.single{grid-template-columns:1fr;max-width:380px;}
  .rankRow{
    display:flex;align-items:center;gap:12px;padding:8px 12px;
    background:#fff;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);
    animation:slidein .35s steps(5) backwards;
  }
  @keyframes slidein{from{transform:translateX(60px);opacity:0;}to{transform:none;opacity:1;}}
  .rankRow .medal{font-size:20px;width:54px;text-align:center;}
  .rankRow img{width:48px;height:auto;transform:scaleX(-1);}
  .rankRow .who{flex:1;font-size:14px;}
  .rankRow .time{font-size:11px;color:#5a7ba1;}
  .rankRow.first{background:#fff6d8;border-color:#a8741a;box-shadow:0 4px 0 #a8741a;}
  .colorDot{width:14px;height:14px;border:3px solid var(--ink);display:inline-block;vertical-align:-2px;margin-right:6px;}


  /* 모바일 저해상도/짧은 화면 대응: 레인이 잘리지 않도록 스프라이트와 여백 축소 */
  @media (max-height: 430px), (max-width: 480px){
    #trackWrap{padding:38px 0 48px;}
    .runner img{width:var(--runner-size,52px);}
    .bib{
      left:calc(var(--runner-size,52px) - 2px);
      font-size:12px;
      min-width:20px;
      padding:4px 5px 3px;
    }
    .fx{width:56px;}
    #goal{right:26px;}
    #raceTimer{bottom:6px;font-size:16px;padding:4px 12px;}
  }

  @media (prefers-reduced-motion:reduce){
    .cloud,.runner img,#setup .heroSprite{animation:none;}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="cloudLayer"></div>
  <div class="hill"></div>

  <!-- SCREEN 1 : SETUP -->
  <section id="setup" class="screen on">
    <div class="setupCol">
      <h1 class="logo">KOEN<br>코냥이 경주 복불복</h1>
      <img class="heroSprite" id="heroImg" alt="코냥이">
      <div class="sub">속도 10 이상으로 3초를 달리면<br>과열로 2초간 멈춥니다</div>
    </div>
    <div class="setupCol">
      <div class="pxpanel" style="display:flex;flex-direction:column;gap:14px;align-items:center;">
        <div class="sub">참가 인원</div>
        <div class="counterRow">
          <button class="pxbtn round" id="minus" aria-label="인원 줄이기">-</button>
          <div class="countBox" id="countBox">4</div>
          <button class="pxbtn round" id="plus" aria-label="인원 늘리기">+</button>
        </div>
        <div class="miniPreview" id="miniPreview"></div>
      </div>
      <button class="pxbtn gold" id="startBtn" style="font-size:22px;">경주 시작!</button>
    </div>
  </section>

  <!-- SCREEN 2 : RACE -->
  <section id="race" class="screen">
    <div id="raceTimer">00.0</div>
    <div id="trackWrap">
      <div id="goal"></div>
      <div id="goalFlag"></div>
      <div id="lanes"></div>
    </div>
    <div id="countdown"></div>
  </section>

  <!-- SCREEN 3 : RESULT -->
  <section id="result" class="screen">
    <h1 class="logo" style="font-size:22px;">결과 발표</h1>
    <div id="podium"></div>
    <div style="display:flex;gap:12px;">
      <button class="pxbtn" id="againBtn">한번 더</button>
      <button class="pxbtn gold" id="homeBtn">처음으로</button>
    </div>
  </section>
</div>

  shape.forEach(([x,y])=>{
    const b=document.createElement('i');
    b.style.cssText=`left:${x*s}px;top:${y*s}px;width:${s}px;height:${s}px;`;
    c.appendChild(b);
  });
  c.style.width=(5*s)+'px';c.style.height=(3*s)+'px';
  cl.appendChild(c);
}

/* ===== screen helpers ===== */
const S={setup:setup, race:race, result:result};
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));S[id].classList.add('on');}

/* ===== setup screen ===== */
let n=4; const MIN=2, MAX=8;
document.getElementById('heroImg').src=SPRITE;
const countBox=document.getElementById('countBox');
const mini=document.getElementById('miniPreview');
function renderSetup(){
  countBox.textContent=n;
  mini.innerHTML='';
  for(let i=0;i<n;i++){
    const chip=document.createElement('div');
    chip.className='miniChip';
    chip.style.background=RACERS[i].css;
    chip.textContent=i+1;
    mini.appendChild(chip);
  }
}
document.getElementById('plus').onclick=()=>{ if(n<MAX){n++;renderSetup();} };
document.getElementById('minus').onclick=()=>{ if(n>MIN){n--;renderSetup();} };
renderSetup();

/* ===== goal flag pixels ===== */
(function(){
  const f=document.createElement('div');f.className='flagPx';
  for(let i=0;i<12;i++){
    const cell=document.createElement(((i%4)+((i/4)|0))%2? 'b':'i');
    f.appendChild(cell);
  }
  document.getElementById('goalFlag').appendChild(f);
})();

/* ===== race engine ===== */
const TOTAL=100;
let racers=[], rafId=null, tickId=null, t0=0, finished=[], running=false;

function buildLanes(){
  const lanes=document.getElementById('lanes');
  lanes.innerHTML='';
  const wrap=document.getElementById('trackWrap');
  const TOP=8, BOTTOM=64;                  /* BOTTOM: 하단 타이머 공간 */

  /*
    모바일 보정 핵심:
    #race가 display:none인 상태에서 clientHeight를 읽으면 0이 될 수 있다.
    startRace()에서 show('race') 후 requestAnimationFrame으로 이 함수를 호출한다.
  */
  const wrapH=Math.max(1, wrap.clientHeight);
  const usableH=Math.max(1, wrapH-TOP-BOTTOM);
  const laneH=Math.min(118, usableH/n);
  const runnerSize=Math.max(36, Math.min(64, laneH*1.15));

  /* 타이머 바로 위부터 아래→위로 쌓기: 화면이 낮아도 모든 레인이 usableH 안에 들어오도록 계산 */
  const baseY=wrapH-BOTTOM;                /* 레인 묶음의 바닥 기준선 */
  racers=[];
  for(let i=0;i<n;i++){
    const r=RACERS[i];
    const lane=document.createElement('div');
    lane.className='lane';
    lane.style.setProperty('--runner-size', runnerSize+'px');
    lane.style.top=(baseY-(n-i)*laneH)+'px';
    lane.style.height=laneH+'px';
    lane.innerHTML=`<div class="ground"></div>
      <div class="trail" style="background:${r.css};width:0;"></div>
      <div class="runner">
        <img src="${SPRITE}" alt="${i+1}번 ${r.name}">
        <span class="bib" style="background:${r.css}">${i+1}</span>
        <img class="fx" alt="">
      </div>`;
    document.getElementById('lanes').appendChild(lane);
    racers.push({
      i, def:r, el:lane.querySelector('.runner'), trail:lane.querySelector('.trail'),
      fx:lane.querySelector('.fx'),
      pos:0, speed:5, hot:0, stopUntil:0, done:false, time:0, fxFrame:-1
    });
  }
}

async function enterFullscreen(){
  const el = document.documentElement;
  try{
    if(el.requestFullscreen){
      await el.requestFullscreen();
    }else if(el.webkitRequestFullscreen){
      await el.webkitRequestFullscreen();
    }
  }catch(e){}
}

function startRace(){
  show('race');

  /* 화면 전환 후 한 프레임 뒤 레인 생성: 모바일에서 숨김 화면 높이 0 측정 방지 */
  requestAnimationFrame(()=>{
    buildLanes();
    const cd=document.getElementById('countdown');
    const seq=['3','2','1','GO!'];
    let k=0;
    cd.textContent=seq[0];
    const ci=setInterval(()=>{
      k++;
      if(k<seq.length){cd.textContent=seq[k];}
      else{clearInterval(ci);cd.textContent='';beginLoop();}
    },700);
  });
}

function beginLoop(){
  finished=[];running=true;
  t0=performance.now();
  let last=t0;
  /* per-second acceleration tick */
  tickId=setInterval(()=>{
    const now=performance.now();
    racers.forEach(r=>{
      if(r.done||now<r.stopUntil) return;
      r.speed=Math.max(5,Math.min(15, r.speed+(Math.floor(Math.random()*7)-3)));
    });
  },1000);

  const wrap=document.getElementById('trackWrap');
  const goalX=wrap.clientWidth-34-13;     /* goal line position */
  const startX=6, runW=goalX-startX-96;   /* sprite + 번호표 travel width */

  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    const elapsed=(now-t0)/1000;
    document.getElementById('raceTimer').textContent=elapsed.toFixed(1);

    racers.forEach(r=>{
      if(r.done) return;
      const stopped=now<r.stopUntil;
      r.el.classList.toggle('stopped',stopped);
      if(stopped){
        /* 폭발 → 연기 → 숨김 시퀀스 (정지 2초 동안) */
        const phase=now-(r.stopUntil-2000);
        let f;
        if(phase<130)       f=0;
        else if(phase<280)  f=1;
        else if(phase<460)  f=2;
        else if(phase<1250) f=3;           /* 연기 */
        else                f=-2;          /* 연기 종료 → 숨김 */
        if(f!==r.fxFrame){
          r.fxFrame=f;
          if(f<0){
            r.fx.classList.remove('show','smoking');
          }else{
            r.fx.src=BOOM[f];
            r.fx.classList.add('show');
            r.fx.classList.toggle('smoking', f===3);
          }
        }
        return;
      }
      if(r.fxFrame!==-1){                  /* 재출발: 이펙트 정리 */
        r.fxFrame=-1;
        r.fx.classList.remove('show','smoking');
      }
      /* overheat check: speed>=10 sustained 3s */
      if(r.speed>=10){ r.hot+=dt; } else { r.hot=0; }
      if(r.hot>=3){
        r.hot=0; r.stopUntil=now+2000; r.speed=5; return;
      }
      r.pos+=r.speed*dt;
      if(r.pos>=TOTAL){
        r.pos=TOTAL; r.done=true; r.time=elapsed;
        finished.push(r);
      }
      const x=startX+(r.pos/TOTAL)*runW;
      r.el.style.transform=`translateX(${x}px)`;
      r.trail.style.width=(x+20)+'px';
    });

    if(finished.length===racers.length){
      running=false;
      clearInterval(tickId);
      setTimeout(showResult,800);
      return;
    }
    rafId=requestAnimationFrame(frame);
  }
  rafId=requestAnimationFrame(frame);
}

/* ===== result ===== */
const MEDALS=['1위','2위','3위'];
function showResult(){
  show('result');
  const pod=document.getElementById('podium');
  pod.classList.toggle('single', finished.length<=4);
  pod.innerHTML='';
  finished.forEach((r,idx)=>{
    const row=document.createElement('div');
    row.className='rankRow'+(idx===0?' first':'');
    row.style.animationDelay=(idx*0.12)+'s';
    row.innerHTML=`
      <div class="medal">${idx<3?MEDALS[idx]:(idx+1)+'위'}</div>
      <img src="${SPRITE}" alt="">
      <span class="miniChip" style="background:${r.def.css};flex:none;">${r.i+1}</span>
      <div class="who">${r.i+1}번 ${r.def.name}</div>
      <div class="time">${r.time.toFixed(1)}s</div>`;
    pod.appendChild(row);
  });
}

/* ===== nav ===== */
document.getElementById('startBtn').onclick = async () => {
  await enterFullscreen();
  startRace();
};
  
  window.addEventListener('resize',()=>{
  /* 모바일 주소창/회전으로 뷰포트가 바뀔 때 다음 경주 레이아웃이 깨지지 않도록 현재 레이스 화면만 재배치 */
  if(S.race.classList.contains('on') && !running){
    requestAnimationFrame(buildLanes);
  }
});
document.getElementById('againBtn').onclick=startRace;
document.getElementById('homeBtn').onclick=()=>{cancelAnimationFrame(rafId);clearInterval(tickId);show('setup');};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
